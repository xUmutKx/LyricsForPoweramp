[versions]
accompanistPermissions = "0.37.3"
datastorePreferences = "1.2.1"
documentfile = "1.1.0"
gson = "2.14.0"
coreSplashscreen = "1.2.0"
agp = "9.2.1"
hiltAndroid = "2.60"
hiltWork = "1.4.0"
